[project]
name = "ploy-backend"
version = "0.1.0"
description = "FastAPI backend for Ploy board game"
authors = [{name = "Ploy Developer"}]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0", 
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]